name: Vite compatibility

on:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # GitHub disables scheduled workflows after 60 days without repo activity.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/compat.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    name: Vite ${{ matrix.vite }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.vite == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        vite: ["5", "6", "7", "latest", "beta"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Use Vite ${{ matrix.vite }}
        run: pnpm add -D vite@${{ matrix.vite }}
      - name: Build the fixture with the plugin
        run: node test/compat/vite-build.mjs
